name: Core integration guardrails

on:
  push:
    branches:
      - feat/central-xray-openvpn-core
  pull_request:
    branches:
      - main

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run core guardrail tests
        run: python -m unittest discover -s v2/backend/tests -v
